# Supabase project configuration for Boosta.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "boosta"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
# Kuwait/GCC: phone + email auth are both first-class.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
