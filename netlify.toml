# Netlify deployment config for the Boosta web app (Next.js).
# The official Next.js runtime plugin handles SSR, API routes, and the proxy.
[build]
  command = "npm run build"

[build.environment]
  # Netlify build images may not ship Node 24 (from .nvmrc); pin a supported LTS.
  NODE_VERSION = "22"
  # The Supabase anon key is a NEXT_PUBLIC_* var: Next.js intentionally inlines
  # it into the client bundle, and it is safe to expose (access is gated by RLS
  # on the database). Exempt just this key from Netlify's secrets scanner so the
  # expected inlining doesn't fail the build. The service-role key is NOT listed
  # here and stays fully protected.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Supabase env vars (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY) must be set in Netlify → Site settings →
# Environment variables. They are optional at build time, so a first deploy
# succeeds without them; set them to enable live auth + data.
